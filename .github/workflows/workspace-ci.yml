name: Workspace CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - uses: oven-sh/setup-bun@v2

      - name: Check public workspace boundary
        run: node scripts/verify-public-workspace.mjs

      - name: Install from committed lockfile
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Check types
        run: pnpm check-types

      - name: Inspect package contents without publishing
        run: |
          pnpm --filter @dev/util pack --dry-run
          pnpm --filter @dev/aws pack --dry-run
          pnpm --filter @dev/scripts pack --dry-run
