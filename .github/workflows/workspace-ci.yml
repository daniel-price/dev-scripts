name: Workspace CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v5

      - name: Check public workspace boundary
        run: node scripts/verify-public-workspace.mjs

      - name: Install from committed lockfile
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Check types
        run: pnpm check-types

      - name: Inspect package contents without publishing
        run: |
          pnpm --filter @daniel-price/util pack --dry-run
          pnpm --filter @daniel-price/aws pack --dry-run
          pnpm --filter @daniel-price/scripts pack --dry-run
